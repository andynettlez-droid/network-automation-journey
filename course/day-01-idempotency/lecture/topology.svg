<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc" font-family="system-ui,-apple-system,sans-serif">
  <title id="ttl">Day 1 topology</title>
  <desc id="dsc">Two virtual routers, srl1 and srl2, connected by a cable between their ethernet-1/1 ports. We declare the IP address 10.0.0.1/30 on srl1's ethernet-1/1 port, idempotently.</desc>

  <text x="350" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text,#1a1a1a)">Day 1 — two routers, one cable</text>
  <text x="350" y="62" text-anchor="middle" font-size="13" fill="var(--muted,#6b7280)">Give srl1's port an address — and make re-running change nothing</text>

  <rect x="70" y="150" width="180" height="92" rx="12" fill="var(--card,#eef2ff)" stroke="var(--accent,#4f46e5)" stroke-width="2"/>
  <text x="160" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="var(--text,#1a1a1a)">srl1</text>
  <text x="160" y="210" text-anchor="middle" font-size="12" fill="var(--muted,#6b7280)">virtual router</text>

  <rect x="450" y="150" width="180" height="92" rx="12" fill="var(--card,#eef2ff)" stroke="var(--accent,#4f46e5)" stroke-width="2"/>
  <text x="540" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="var(--text,#1a1a1a)">srl2</text>
  <text x="540" y="210" text-anchor="middle" font-size="12" fill="var(--muted,#6b7280)">virtual router</text>

  <line x1="250" y1="196" x2="450" y2="196" stroke="var(--text,#1a1a1a)" stroke-width="2"/>
  <circle cx="250" cy="196" r="4" fill="var(--accent,#4f46e5)"/>
  <circle cx="450" cy="196" r="4" fill="var(--accent,#4f46e5)"/>
  <text x="350" y="188" text-anchor="middle" font-size="11" fill="var(--muted,#6b7280)">cable</text>
  <text x="270" y="226" font-size="11" fill="var(--muted,#6b7280)">ethernet-1/1</text>
  <text x="430" y="226" text-anchor="end" font-size="11" fill="var(--muted,#6b7280)">ethernet-1/1</text>

  <rect x="70" y="270" width="180" height="34" rx="8" fill="none" stroke="var(--accent,#4f46e5)" stroke-dasharray="5 3"/>
  <text x="160" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent,#4f46e5)">IP: 10.0.0.1 / 30</text>
  <line x1="160" y1="242" x2="160" y2="270" stroke="var(--accent,#4f46e5)" stroke-width="1.5"/>

  <text x="350" y="338" text-anchor="middle" font-size="12" fill="var(--muted,#6b7280)">"interface" = a port  ·  "IP /30" = its address on a tiny 2-host network  ·  run twice = no change</text>
</svg>
