<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idempotency, animated</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0f1220;color:#e8eaf2;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#9aa3b2;font-size:14px;margin:0 0 18px}
  .stage{background:#fff;border-radius:12px;padding:10px}
  svg{display:block;width:100%;height:auto}
  .controls{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  button{font:inherit;font-weight:600;border:1px solid #2f3550;border-radius:9px;padding:9px 16px;cursor:pointer;background:#1d2238;color:#e8eaf2}
  button.primary{background:#4f46e5;border-color:#4f46e5;color:#fff}
  button:disabled{opacity:.45;cursor:default}
  .counter{margin-left:auto;font-family:ui-monospace,monospace;font-size:15px;color:#c7cdda}
  .counter b{color:#fff}
  .note{color:#b9c0d0;font-size:14px;margin-top:14px;min-height:22px}
  #ip{opacity:0;transition:opacity .6s ease}
  .applied #ip{opacity:1}
  #pulse{opacity:0}
  .running #pulse{opacity:1;animation:flow 1.1s ease forwards}
  @keyframes flow{from{transform:translateX(0)}to{transform:translateX(245px)}}
  #srl1box{transition:filter .3s}
  .glow #srl1box{filter:drop-shadow(0 0 9px #f59e0b)}
</style></head>
<body><div class="wrap">
  <h1>Idempotency, in motion</h1>
  <p class="sub">Run it once &mdash; the address appears. Run it again &mdash; nothing moves. That stillness is the whole idea.</p>
  <div class="stage">
    <svg viewBox="0 0 560 230" font-family="system-ui,sans-serif">
      <rect x="20" y="88" width="110" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
      <text x="75" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">playbook</text>
      <text x="75" y="130" text-anchor="middle" font-size="10" fill="#6b7280">desired state</text>
      <line x1="130" y1="116" x2="300" y2="116" stroke="#cbd2e0" stroke-width="2" stroke-dasharray="4 4"/>
      <circle id="pulse" cx="135" cy="116" r="6" fill="#4f46e5"/>
      <g id="srl1box">
        <rect x="300" y="82" width="150" height="68" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
        <text x="375" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">srl1</text>
        <text x="375" y="132" text-anchor="middle" font-size="11" fill="#6b7280">ethernet-1/1</text>
      </g>
      <g id="ip">
        <rect x="300" y="166" width="150" height="30" rx="8" fill="#e8fff0" stroke="#16a34a" stroke-width="1.5"/>
        <text x="375" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">10.0.0.1 / 30</text>
      </g>
      <rect id="badgebox" x="468" y="100" width="80" height="32" rx="8" fill="#eceff5"/>
      <text id="badge" x="508" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">no IP</text>
    </svg>
  </div>
  <div class="controls">
    <button id="b1" class="primary" onclick="runOne()">&#9654; Run 1</button>
    <button id="b2" onclick="runTwo()" disabled>&#9654; Run it again</button>
    <button onclick="reset()">&#8634; Reset</button>
    <span class="counter">changed = <b id="cnt">&ndash;</b></span>
  </div>
  <p class="note" id="note">Press <b>Run 1</b> to apply the address.</p>

<script>
const svg=document.querySelector('svg'), badge=document.getElementById('badge'),
  badgebox=document.getElementById('badgebox'), cnt=document.getElementById('cnt'),
  note=document.getElementById('note'), b1=document.getElementById('b1'), b2=document.getElementById('b2');
function pulse(cb){ svg.classList.remove('running'); void svg.offsetWidth; svg.classList.add('running'); setTimeout(cb,1100); }
function runOne(){
  b1.disabled=true; note.textContent='Sending the desired state to the device…';
  pulse(()=>{ svg.classList.add('applied'); badgebox.setAttribute('fill','#dcfce7'); badge.setAttribute('fill','#15803d'); badge.textContent='changed';
    cnt.textContent='1'; cnt.style.color='#ffcf70'; note.innerHTML='The device had no address, so it <b>changed</b> &mdash; the IP appears. (changed = 1)'; b2.disabled=false; });
}
function runTwo(){
  b2.disabled=true; note.textContent='Running the exact same thing again…';
  pulse(()=>{ svg.classList.add('glow'); setTimeout(()=>svg.classList.remove('glow'),500);
    badgebox.setAttribute('fill','#fef3c7'); badge.setAttribute('fill','#b45309'); badge.textContent='ok';
    cnt.textContent='0'; cnt.style.color='#7ee2a8'; note.innerHTML='The address was <b>already there</b> &mdash; nothing moved, nothing changed. (changed = 0) &nbsp;<b>That is idempotency.</b>'; });
}
function reset(){ svg.classList.remove('applied','glow','running'); badgebox.setAttribute('fill','#eceff5'); badge.setAttribute('fill','#6b7280'); badge.textContent='no IP'; cnt.textContent='–'; cnt.style.color=''; b1.disabled=false; b2.disabled=true; note.textContent='Press Run 1 to apply the address.'; }
</script>
</body></html>
